{% set name = "rubin-nights" %}
{% set version = "0.18.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/rubin_nights-{{ version }}.tar.gz
  sha256: a4b4a516c1cf189b3244265010269d2f01af26bb95c52f772afa1cd5741a352b

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - setuptools-scm >=8
    - pip
  run:
    - python >={{ python_min }}
    - astropy-base
    - astroplan
    - healpy
    - httpx
    - lsst-ts-xml
    - matplotlib-base
    - numpy
    - pandas
    - psycopg
    - pyvo
    - pyyaml
    - rubin-scheduler >=3.18
    - rubin-sim
    - sqlalchemy

test:
  imports:
    - rubin_nights
  requires:
    - pip
    - python {{ python_min }}
    - lxml

about:
  home: https://github.com/lsst-sims/rubin_nights
  summary: Tools to access Rubin nightly observing data
  license: GPL-3.0-or-later
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rhiannonlynne
